name: Verify mobile
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:sqlite
      - run: npm run build
      - run: npx cap sync android
      - name: Install Android SDK packages
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          sdk = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools', 'latest', 'bin', 'sdkmanager')
          subprocess.run([sdk, '--licenses'], input='y\n'*100, text=True, check=True)
          subprocess.run([sdk, 'platforms;android-35', 'platforms;android-36', 'build-tools;35.0.0', 'build-tools;36.0.0'], input='y\n'*100, text=True, check=True)
          PYTHON
      - run: bash gradlew --no-daemon --max-workers=2 assembleDebug
        working-directory: android
