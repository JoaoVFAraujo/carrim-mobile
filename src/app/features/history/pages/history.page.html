<ion-header class="ion-no-border">
  <ion-toolbar><ion-title>Histórico</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <main class="tw:mx-auto tw:max-w-lg tw:pt-2 tw:pb-6">
    <h1 class="tw:mt-0 tw:text-3xl tw:font-semibold">Histórico</h1>
    <app-empty-state
      [icon]="emptyIcon"
      title="Nenhuma compra finalizada ainda"
      description="Quando você finalizar uma compra, poderá consultar os itens e o total por aqui."
    >
      <ion-button routerLink="/tabs/home" fill="outline">Ir para o início</ion-button>
    </app-empty-state>
  </main>
</ion-content>
