<ion-header>
  <ion-toolbar><ion-title>Carrim</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <main class="tw:mx-auto tw:max-w-lg tw:py-6">
    <p class="tw:text-sm tw:font-medium tw:text-green-800">COMPRAS COM MAIS CLAREZA</p>
    <h1 class="tw:mt-3 tw:text-3xl tw:font-semibold">Suas compras, com mais clareza.</h1>
    <p class="tw:mt-4 tw:text-lg tw:leading-relaxed">
      Acompanhe o que vai para o carrinho e saiba quanto está gastando.
    </p>
    <app-empty-state
      [icon]="basketIcon"
      title="Pronto para fazer suas compras?"
      description="Você ainda não tem uma compra em andamento. Seu próximo carrinho começa aqui."
    >
      <ion-button routerLink="/tabs/cart">Ver carrinho</ion-button>
    </app-empty-state>
    <section class="tw:border-t tw:border-gray-200 tw:pt-6" aria-labelledby="recent-shopping-title">
      <h2 id="recent-shopping-title" class="tw:text-lg tw:font-semibold">Últimas compras</h2>
      <p class="tw:mt-2">Suas compras finalizadas aparecerão aqui.</p>
      <ion-button fill="clear" routerLink="/tabs/history">Ver histórico</ion-button>
    </section>
  </main>
</ion-content>
