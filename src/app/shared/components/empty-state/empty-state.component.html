<section
  class="tw:flex tw:flex-col tw:items-center tw:rounded-3xl tw:bg-[#eef3ec] tw:px-5 tw:py-7 tw:text-center"
>
  <ion-icon [icon]="icon()" color="primary" aria-hidden="true" class="tw:text-6xl" />
  <h2 class="tw:mt-4 tw:mb-0 tw:text-xl tw:font-semibold">{{ title() }}</h2>
  <p class="tw:mt-3 tw:mb-0 tw:max-w-sm tw:text-base tw:leading-relaxed tw:text-gray-600">
    {{ description() }}
  </p>
  <div class="tw:mt-4"><ng-content /></div>
</section>
