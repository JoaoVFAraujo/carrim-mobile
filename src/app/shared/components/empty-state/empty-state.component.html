<ion-card class="feature-card" animate.enter="motion-enter">
  <ion-card-content class="empty-content">
    <span class="card-icon"><ion-icon [icon]="icon()" aria-hidden="true" /></span>
    <h2>{{ title() }}</h2>
    <p class="card-description">{{ description() }}</p>
    <div class="tw:flex tw:flex-wrap tw:gap-2"><ng-content /></div>
  </ion-card-content>
</ion-card>
